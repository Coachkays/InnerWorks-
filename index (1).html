<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inner Works | Find your pattern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#12302A;--paper:#EDF0EA;--gold:#E0A526;--sage:#B9CDBE;--mid:#3F6B5C;--line:#cdd8cf}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.55 Figtree,system-ui,sans-serif;overflow-x:hidden}
h1,h2,.brand{font-family:"Bricolage Grotesque",Georgia,sans-serif;letter-spacing:-.02em;line-height:1.08}
.orb{position:fixed;right:-18vmin;top:-14vmin;width:calc(46vmin + var(--p,0)*34vmin);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold),#c9a24a 38%,var(--sage) 72%);opacity:.55;transition:width 1s cubic-bezier(.3,.7,.2,1);animation:breathe 7s ease-in-out infinite;z-index:0}
@keyframes breathe{50%{transform:scale(1.09)}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:22px 22px 60px;min-height:100vh;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:20px;margin-bottom:7vh}
.screen{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
h1{font-size:clamp(34px,9vw,50px);font-weight:700;margin-bottom:16px}
h2{font-size:clamp(25px,6.5vw,32px);font-weight:500;margin:26px 0 22px}
p.sub{font-size:19px;max-width:44ch;margin-bottom:26px}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--ink);color:#fff;font:600 17px Figtree,sans-serif;padding:16px 28px;border-radius:999px;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{background:var(--mid);transform:translateY(-2px)}
.btn.wa{background:#1f8f4e;display:block;text-align:center}
.btn.wa:hover{background:#17773f}
.note{font-size:14px;color:var(--mid);margin-top:16px;max-width:46ch}
.alt{margin-top:34px;font-size:15px}
.alt a{color:var(--ink);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:9px;transition:width .5s ease}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:0 0 10px;color:var(--mid)}
.back{background:none;border:0;color:var(--mid);font:inherit;cursor:pointer;padding:4px 0}
.opts{display:grid;gap:10px}
.opt{background:rgba(255,255,255,.7);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;font:500 17px Figtree,sans-serif;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.opt:hover,.opt:focus-visible{border-color:var(--gold);background:#fff;transform:translateX(4px);outline:0}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}
.pic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:96px;padding:18px 10px;background:rgba(255,255,255,.75);border:1.5px solid var(--line);border-radius:20px;font:600 16px Figtree,sans-serif;color:var(--ink);text-align:center;text-decoration:none;cursor:pointer;animation:pop .45s both;animation-delay:calc(var(--d,0)*70ms);transition:border-color .15s,background .15s,transform .15s}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
.pic svg{width:58px;height:58px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,transform .3s}
.pic:hover,.pic:focus-visible{border-color:var(--gold);background:#fff;transform:translateY(-3px);outline:0}
.pic:hover svg{stroke:var(--gold);transform:scale(1.08)}
.pic.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pic.on svg{stroke:var(--gold);transform:scale(1.12)}
label{display:block;font-weight:600;font-size:15px;margin:16px 0 6px}
input[type=text],input[type=email]{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;font:17px Figtree,sans-serif;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.chk{display:flex;gap:10px;font-weight:400;font-size:14px;margin:16px 0 22px;align-items:flex-start}
.chk input{margin-top:4px;accent-color:var(--ink)}
.big{font-family:"Bricolage Grotesque",Georgia,sans-serif;font-weight:700;font-size:clamp(54px,16vw,88px);line-height:1;margin:6px 0 4px}
.meter{margin:16px 0}
.meter span{font-size:15px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:6px}
.meter .bar{height:10px}
.meter .bar i{transition:width 1.1s cubic-bezier(.3,.7,.2,1)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px;margin:26px 0 16px}
.card b{font-family:"Bricolage Grotesque",Georgia,sans-serif;font-size:20px}
.err{color:#a3321f;font-size:14px;margin-top:8px;min-height:20px}
.card p{margin:6px 0 14px}.card p:last-child{margin-bottom:0}
.ins{padding:26px 22px;margin-top:30px}.ins b{font-size:25px;line-height:1.15;display:block;margin-bottom:12px}.ins p{font-size:18px}
.scan{margin:12px 0;font-weight:500;animation:in .5s both;animation-delay:calc(var(--d)*.9s)}
#sb{transition:width 3.6s linear}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb" id="orb"></div>
<div class="wrap"><div class="brand">Inner Works</div><div id="app"></div></div>
<script src="settings.js"></script>
<script>
const CFG=window.IW||{whatsapp:"",endpoint:""};

/* Picture icons (free, built in). Add more by pasting SVG paths. */
const ic={
w:'<circle cx="32" cy="22" r="9"/><path d="M12 58c2-14 9-19 20-19s18 5 20 19M23 22c-1-14 18-14 18 0v14M23 22v14"/>',
m:'<circle cx="32" cy="22" r="9"/><path d="M12 58c2-14 9-19 20-19s18 5 20 19M23 19c3-8 15-8 18 0"/>',
n:'<circle cx="32" cy="22" r="9"/><path d="M12 58c2-14 9-19 20-19s18 5 20 19"/>',
wave:'<path d="M6 30c8-10 16-10 26 0s18 10 26 0M6 46c8-10 16-10 26 0s18 10 26 0"/>',
heart:'<path d="M32 54C10 38 10 18 22 16c6-1 9 3 10 6 1-3 4-7 10-6 12 2 12 22-10 38z"/>',
sun:'<circle cx="32" cy="32" r="9"/><path d="M32 8v8M32 48v8M8 32h8M48 32h8M15 15l6 6M43 43l6 6M49 15l-6 6M21 43l-6 6"/>',
tgt:'<circle cx="32" cy="32" r="22"/><circle cx="32" cy="32" r="12"/><circle cx="32" cy="32" r="3"/>',
bub:'<path d="M10 12h44v28H30L18 52V40h-8z"/>',
cloud:'<path d="M18 46h30a10 10 0 0 0 0-20 14 14 0 0 0-27-3 11 11 0 0 0-3 23z"/>'
};
const svg=p=>`<svg viewBox="0 0 64 64" aria-hidden="true">${p}</svg>`;

/* Picture-card steps shown before every quiz */
const STEPS=[
 ["I am…",[["Woman",ic.w],["Man",ic.m],["Prefer not to say",ic.n]]],
 ["What do you want most right now?",[["Inner calm",ic.wave],["Better relationships",ic.heart],["More confidence",ic.sun],["Lasting habits",ic.tgt]]],
 ["How old are you?",[["18–24"],["25–34"],["35–44"],["45+"]]]
];

const SC=["Not me","A little","Sometimes","Mostly","Totally me"];
/* Step types:
   ["statement","trait"] or ["statement","trait",1 = reverse]  -> 5-point scale
   {t:"question", o:[["answer","a5,v1"],...]}                   -> scenario choice (trait+score per answer)
   {i:"Title", b:"Text"}                                        -> insight card (not scored) */
const Q={
attachment:{ic:ic.heart,name:"attachment style",
  title:"What’s your attachment style?",
  sub:"15 honest questions about how you love, trust and protect yourself in relationships.",
  qs:[
  {t:"Someone you care about goes quiet for a whole day. What do you most likely do?",o:[
    ["Check my phone again and again, then send another message","a5,v1"],
    ["Tell myself I don’t care and keep busy","a2,v5"],
    ["Assume they’re busy, carry on, and check in calmly later","a1,v1"],
    ["Replay everything I said, then pull back","a4,v4"]]},
  ["I worry that the people I love will leave me.","a"],
  ["I feel smothered when someone gets too close.","v"],
  {i:"Your attachment style is a nervous-system habit, not a flaw.",b:"It was learned early, from how comfort and closeness were handled around you. What was learned can be updated, and that is what Inner Works is for."},
  {t:"When I was upset as a child, the adults around me mostly…",o:[
    ["Comforted me and helped me understand my feelings","a1,v1"],
    ["Were there sometimes and not other times","a5,v2"],
    ["Told me to stop crying or toughen up","a2,v5"],
    ["Were unpredictable or frightening to be around","a4,v4"],
    ["I don’t remember much about it","a3,v3"]]},
  ["I overthink texts and read hidden meaning into silence.","a"],
  ["I would rather handle problems alone than ask for help.","v"],
  {t:"When I feel rejected, my body usually…",o:[
    ["Tightens up, my chest races and I need reassurance now","a5,v1"],
    ["Goes numb and I shut down","a1,v5"],
    ["Heats up and I want to fight or leave","a4,v4"],
    ["Settles after a while and I can talk about it","a1,v1"]]},
  {i:"Protest or retreat: two ways of protecting yourself.",b:"Anxious attachment protests, through chasing, checking and over-explaining. Avoidant attachment retreats, through distance and “I’m fine”. Both are guarding against the same fear: losing safety."},
  ["I need a lot of reassurance to feel safe in a relationship.","a"],
  ["I pull away when a relationship starts to get serious.","v"],
  {t:"In a conflict, I usually…",o:[
    ["Say too much, apologise, then worry for days","a5,v1"],
    ["Go quiet and leave the room","a1,v5"],
    ["Say how I feel and listen to their side","a1,v1"],
    ["Blow up, then go cold","a4,v4"]]},
  ["When someone becomes distant, I panic or chase.","a"],
  ["Talking about my feelings makes me uncomfortable.","v"],
  {t:"What do you want most in love?",o:[
    ["To feel chosen without having to prove it","a5,v1"],
    ["To keep my freedom and not be controlled","a1,v5"],
    ["Closeness and independence together","a1,v1"],
    ["To finally stop repeating the same pattern","a3,v3"]]},
  ["I fear I care more than the other person does.","a"],
  ["I keep part of myself hidden, even from people I love.","v"],
  {i:"Almost there. Patterns can change.",b:"People move toward secure attachment through awareness, safe relationships and small daily practice. Your report shows where to start."}]},
resilience:{ic:ic.wave,name:"emotional resilience",bl:"Emotional resilience",
  title:"What’s your emotional resilience score?",
  sub:"10 quick questions about how you handle stress, setbacks and big feelings.",
  qs:[
  ["After a setback, I find my footing within a few days."],
  ["Small problems feel like the end of the world.",1],
  ["When I’m upset, I can calm my body down."],
  ["I stay stuck replaying what went wrong.",1],
  ["I can ask for help when I need it."],
  ["Stress shows up in my body: tight chest, poor sleep, racing mind.",1],
  ["I can feel a hard emotion without being swept away."],
  ["I snap at people when I’m overwhelmed.",1],
  ["I bounce back after rejection or disappointment."],
  ["I believe I can get through difficult seasons."]],
  lv:[[70,"Strong","You recover well and stay fairly steady under pressure. Your work is protecting that strength when life piles on."],
      [40,"Building","You have real resilience, and it gets stretched when stress stacks up. A few daily practices can raise it quickly."],
      [0,"Stretched","Right now your system is carrying a lot. That is a signal, not a flaw, and resilience is a skill you can rebuild."]]},
beliefs:{ic:ic.bub,name:"relationship beliefs",bl:"Limiting relationship beliefs",
  title:"What beliefs are shaping your love life?",
  sub:"8 questions about the hidden rules you carry into every relationship.",
  qs:[
  ["Love means someone has to complete me."],
  ["If I show my real self, people will leave."],
  ["I always end up with the wrong people."],
  ["If someone needs space, it means they don’t love me."],
  ["I have to earn love by being useful or perfect."],
  ["Conflict means the relationship is failing."],
  ["I can trust my judgment about who is safe for me.",1],
  ["I deserve a love that feels peaceful.",1]],
  lv:[[65,"Heavy limiting beliefs","Some old rules about love are running your relationships. They were learned, often young, and they can be unlearned."],
      [35,"Some limiting beliefs","You hold a mix of healthy and limiting beliefs. Under stress, the old rules take over. Naming them takes away their power."],
      [0,"Mostly healthy beliefs","Your beliefs about love are largely healthy. Your work is spotting the few that still show up when you feel threatened."]]},
victim:{ic:ic.cloud,name:"victim mindset",bl:"Victim mindset",
  title:"Are you stuck in a victim story?",
  sub:"8 honest questions about where you give your power away.",
  qs:[
  ["Most of my problems are caused by other people."],
  ["Nothing I do really changes how things turn out."],
  ["I often think: why does this always happen to me?"],
  ["I can name which part of a conflict was mine.",1],
  ["I wait for others to change before I do."],
  ["I tell the story of what was done to me more than what I am doing about it."],
  ["When things go wrong, I look for what I can change.",1],
  ["I feel stuck and I can’t see a way out."]],
  lv:[[65,"Strong victim pattern","You often feel that life is happening to you. That usually grows from real hurt, and it is also where your power gets lost. The shift starts with small acts of ownership."],
      [35,"Sometimes in the story","You move between ownership and powerlessness, especially under stress. Catching the moment you slip is the first skill."],
      [0,"Ownership mindset","You tend to see your part and look for what you can change, even when things aren’t fair. Your edge is keeping ownership without self-blame."]]},
habits:{ic:ic.tgt,name:"habits and consistency",bl:"Consistency",
  title:"Why can’t you stay consistent?",
  sub:"8 questions to find what breaks your habits, and how to fix it.",
  qs:[
  ["I follow through on what I promise myself."],
  ["I start strong and quit within a few weeks.",1],
  ["I have a daily routine that keeps me steady."],
  ["One missed day usually becomes a missed week.",1],
  ["I can keep going when motivation is gone."],
  ["I wait until I feel ready before I begin.",1],
  ["I review my progress regularly."],
  ["My daily habits match the person I want to become."]],
  lv:[[70,"Consistent","You keep your word to yourself most of the time. Your next level is making your habits survive stressful weeks."],
      [40,"Capable but inconsistent","You can build habits, and something keeps breaking them. Finding that trigger matters more than trying harder."],
      [0,"Starting over","Your habits keep collapsing, and that is rarely about discipline. Smaller steps and a better system usually fix it."]]}
};

const ATT={
secure:["Secure","You tend to trust easily and stay steady when closeness or distance shows up. Your work is keeping that steadiness when life gets stressful.","You can ask for what you need and hear a no without falling apart.","Under heavy stress you can still slip into old protective habits, and you may assume closeness is as easy for others as it is for you.","Pick one relationship this week and practise saying a need out loud, plainly and kindly."],
anxious:["Anxious","You love deeply and feel safest when connection is certain. When it wobbles, your mind and body go on alert. This is a learned pattern, and learned patterns can change.","You are warm, attentive and quick to notice how others feel.","Silence or distance can feel like danger, so you may chase, over-explain or seek reassurance, which can push people away.","Next time you feel the urge to check or chase, take five slow breaths and name the fear in one sentence before you act."],
avoidant:["Avoidant","You value independence and calm. Closeness can feel like pressure, so you step back before anyone can get too near. This is a protective pattern, and it can soften.","You are self-reliant, steady in a crisis and respectful of other people’s space.","You may call it independence when it is really protection, and the people close to you can feel shut out.","Share one small feeling with someone safe this week, a single honest sentence, and notice that you survive it."],
fearful:["Fearful-avoidant","You want closeness and fear it at the same time, so you can swing between reaching out and pulling away. It is exhausting, and it is a pattern that can be healed.","You feel deeply and understand both sides of the pull, which makes you very perceptive.","The push and pull can look like hot and cold to the people you love, when you are really trying to stay safe.","When you notice the swing, tell yourself: I want closeness and I am scared. Naming both halves lowers the intensity."]};

const $=s=>document.querySelector(s),app=$("#app");
const P=new URLSearchParams(location.search);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let key=Q[P.get("q")]?P.get("q"):null,src=P.get("v")||"direct",i=0,A=[],G=[];
const quiz=()=>Q[key];
const norm=x=>Array.isArray(x)?{t:x[0],k:typeof x[1]==="string"?x[1]:"s",r:typeof x[1]==="number"}:x;
const orb=p=>$("#orb").style.setProperty("--p",p);
const show=h=>{app.innerHTML='<div class="screen">'+h+'</div>';window.scrollTo(0,0)};
const cap=s=>s[0].toUpperCase()+s.slice(1);

function home(){
  orb(.3);
  show(`<h1>Find your pattern.</h1><p class="sub">Pick a quiz. Each one takes about 2 to 4 minutes.</p>
  <div class="pics">${Object.keys(Q).map((k,j)=>`<a class="pic" style="--d:${j}" href="?q=${k}&v=${encodeURIComponent(src)}">${svg(Q[k].ic)}<span>${cap(Q[k].name)}</span></a>`).join("")}</div>
  <p class="note">Private, free and unlimited. Self-reflection tools, not diagnoses.</p>`);
}

function intro(){
  orb(0);i=0;A=[];G=[];
  show(`<h1>${quiz().title}</h1><p class="sub">${quiz().sub}</p>
  <button class="btn" id="go">Start the quiz</button>
  <p class="note">Your answers stay private.</p>
  <p class="alt">Want a different one? <a href="?v=${encodeURIComponent(src)}">See all quizzes</a></p>`);
  $("#go").onclick=ask;
}

function ask(){
  const S=STEPS.length,qs=quiz().qs.map(norm),T=S+qs.length,st=i<S,q=st?null:qs[i-S];
  orb(i/T);
  const hd=`<div class="top"><button class="back" id="bk" ${i?"":"hidden"}>‹ Back</button><span>${i+1} of ${T}</span></div><div class="bar"><i style="width:${i/T*100}%"></i></div>`;
  let body;
  if(st)body=`<h2>${STEPS[i][0]}</h2><div class="pics">${STEPS[i][1].map((x,k)=>`<button class="pic${G[i]===x[0]?" on":""}" style="--d:${k}" data-v="${esc(x[0])}">${x[1]?svg(x[1]):""}<span>${x[0]}</span></button>`).join("")}</div>`;
  else if(q.i)body=`<div class="card ins"><b>${q.i}</b><p>${q.b}</p></div><button class="btn" id="nx">Continue</button>`;
  else if(q.o)body=`<h2>${q.t}</h2><div class="opts">${q.o.map((x,k)=>`<button class="opt${A[i-S]===k?" on":""}" data-v="${k}">${x[0]}</button>`).join("")}</div>`;
  else body=`<h2>${q.t}</h2><div class="opts">${SC.map((s,k)=>`<button class="opt${A[i-S]===k+1?" on":""}" data-v="${k+1}">${s}</button>`).join("")}</div>`;
  show(hd+body);
  requestAnimationFrame(()=>{const b=$(".bar i");if(b)b.style.width=(i+1)/T*100+"%"});
  const go=()=>{i++;i<T?ask():scan()};
  document.querySelectorAll(".pic,.opt").forEach(b=>b.onclick=()=>{
    if(st)G[i]=b.dataset.v;else A[i-S]=+b.dataset.v;
    b.classList.add("on");setTimeout(go,240)});
  const nx=$("#nx");if(nx)nx.onclick=()=>{A[i-S]=0;go()};
  const bk=$("#bk");if(bk)bk.onclick=()=>{i--;ask()};
}

function scan(){
  orb(1);
  const L=["Reading your answers","Mapping your nervous-system patterns","Matching them to the Inner Works method","Preparing your personal report"];
  show(`<h1>Analysing your answers…</h1><div class="bar" style="margin:22px 0 26px"><i id="sb"></i></div>${L.map((l,k)=>`<p class="scan" style="--d:${k}">✓ ${l}</p>`).join("")}`);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$("#sb");if(b)b.style.width="100%"}));
  setTimeout(capture,4000);
}

function capture(){
  orb(1);
  show(`<h1>Your result is ready.</h1>
  <p class="sub">Tell us where to send your full Inner Works report.</p>
  <form id="f" novalidate>
    <label for="nm">First name</label><input id="nm" type="text" autocomplete="given-name">
    <label for="em">Email</label><input id="em" type="email" autocomplete="email">
    <label class="chk"><input id="ok" type="checkbox" checked> Send me my report and occasional Inner Works guidance. Unsubscribe any time.</label>
    <button class="btn" type="submit">Show my result</button>
    <div class="err" id="er"></div>
  </form>`);
  $("#f").onsubmit=e=>{
    e.preventDefault();
    const nm=$("#nm").value.trim(),em=$("#em").value.trim();
    if(!nm)return $("#er").textContent="Please add your first name.";
    if(!/^\S+@\S+\.\S+$/.test(em))return $("#er").textContent="Please enter a valid email address.";
    result(nm,em,$("#ok").checked);
  };
}

function score(){
  const q=quiz(),qs=q.qs.map(norm),T={};
  const add=(k,v)=>{(T[k]=T[k]||[]).push(v)};
  qs.forEach((x,j)=>{
    if(x.i||A[j]===undefined)return;
    if(x.o)x.o[A[j]][1].split(",").forEach(c=>add(c[0],+c.slice(1)));
    else add(x.k,x.r?6-A[j]:A[j]);
  });
  const avg=k=>{const a=T[k]||[3];return a.reduce((s,v)=>s+v,0)/a.length};
  if(key!=="attachment"){
    const pct=Math.round((avg("s")-1)/4*100),lv=q.lv.find(l=>pct>=l[0]);
    return{label:lv[1]+" ("+pct+"%)",big:pct+"%",head:lv[1],text:lv[2],bars:[[q.bl,pct]],pct};
  }
  const an=avg("a"),av=avg("v"),st=an>=3?(av>=3?"fearful":"anxious"):(av>=3?"avoidant":"secure"),pc=v=>Math.round((v-1)/4*100),r=ATT[st];
  return{label:r[0],big:r[0],head:"",text:r[1],str:r[2],blind:r[3],step:r[4],bars:[["Anxiety in relationships",pc(an)],["Avoidance of closeness",pc(av)]],pct:null};
}

function result(name,email,consent){
  const r=score();
  const payload={time:new Date().toISOString(),quiz:key,source:src,name,email,consent,gender:G[0]||"",focus:G[1]||"",age:G[2]||"",result:r.label,answers:A.map(x=>x===undefined?0:x).join(",")};
  if(CFG.endpoint){fetch(CFG.endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(()=>{})}
  const msg=`Hi Coach Kay, I’m ${name}. I took the Inner Works ${quiz().name} quiz and my result was: ${r.label}. Please send me my full report.`;
  const wa=`https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(msg)}`;
  orb(r.pct!==null?r.pct/100:.7);
  show(`<p class="sub" style="margin-bottom:0">${esc(name)}, here is your ${quiz().name} result</p>
  <div class="big">${esc(r.big)}</div>
  ${r.head?`<h2 style="margin:4px 0 14px">${r.head}</h2>`:""}
  <p style="max-width:46ch">${r.text}</p>
  <div style="margin-top:18px">${r.bars.map(b=>`<div class="meter"><span>${b[0]}<span>${b[1]}%</span></span><div class="bar"><i data-w="${b[1]}"></i></div></div>`).join("")}</div>
  ${r.str?`<div class="card"><b>Your strength</b><p>${r.str}</p><b>Your blind spot</b><p>${r.blind}</p><b>Your first step</b><p>${r.step}</p></div>`:""}
  <div class="card"><b>Your full report is ready.</b>
  <p>It covers what is behind this pattern, how it shows up for you, and your first steps. It also starts a free 3-day Inner Works trial, with daily prompts and a private community invite.</p>
  <a class="btn wa" href="${wa}" target="_blank" rel="noopener">Get my report on WhatsApp</a></div>
  <p class="note">We will also email it to ${esc(email)}. This quiz is a self-reflection tool, not a diagnosis.</p>
  <p class="alt"><a href="?v=${encodeURIComponent(src)}">Take another quiz</a></p>`);
  setTimeout(()=>document.querySelectorAll(".bar i[data-w]").forEach(b=>b.style.width=b.dataset.w+"%"),150);
}
key?intro():home();
</script>
</body>
</html>
